name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify frontend bundle
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dashboard/static/console.js dashboard/static/console.css

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/dashboard_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/dashboard_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          target="dashboard-deploy@$DEPLOY_HOST"
          ssh_options="-i $HOME/.ssh/dashboard_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          ssh $ssh_options "$target" "mkdir -p /opt/server-dashboard/releases/$GITHUB_SHA"
          rsync -az --delete \
            --exclude='.git/' --exclude='.venv/' --exclude='node_modules/' --exclude='__pycache__/' \
            -e "ssh $ssh_options" ./ "$target:/opt/server-dashboard/releases/$GITHUB_SHA/"
          ssh $ssh_options "$target" "bash /opt/server-dashboard/releases/$GITHUB_SHA/scripts/activate-release.sh $GITHUB_SHA"
